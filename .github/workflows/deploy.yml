name: Deploy Flutter Web

on:
  push:
    branches: [desenvolvimento]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
      - run: flutter pub get
      - name: Validate NutriIA backend URL
        env:
          NUTRIA_API_URL: ${{ vars.NUTRIA_API_URL }}
        run: |
          if [ -z "$NUTRIA_API_URL" ]; then
            echo "::error::Configure the repository variable NUTRIA_API_URL with the public Worker URL ending in /api/chat."
            exit 1
          fi
          case "$NUTRIA_API_URL" in
            https://*) ;;
            *) echo "::error::NUTRIA_API_URL must use HTTPS in production."; exit 1 ;;
          esac
      - run: flutter build web --release --base-href /NutriReceitas/ --dart-define=NUTRIA_API_URL=${{ vars.NUTRIA_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
